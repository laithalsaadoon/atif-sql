# Vale prose lint for the text this repository publishes: docs/**/*.md, site/authored/**/*.md,
# README.md, AGENTS.md and CONTRIBUTING.md, the manuals and the pages the docs site, llms.txt and
# the raw Markdown twins serve. `mise run docs:prose` (scripts/vale_gate.py) runs it, fails on any
# error-level alert, and fails when it checked zero files, fewer files than the scope holds, or a
# glob matched fewer files than its floor in the script's SCOPE. It also fails when any rule's
# warnings rise above its count in .vale-baseline.json, or a rule the baseline does not name
# warns; a missing, empty or unparsable baseline fails too.
#
# The two packages are pinned by release URL and `vale sync` has already written them into
# .vale/styles/, which is committed with each package's LICENSE, so the gate needs no network.
# Moving a package: change its URL, run `vale sync`, restore its LICENSE from the same tag, and
# commit the diff under .vale/styles/ with a `mise run docs:prose` over the tree.
#
# Error is the level that fails on one alert. A warning-level rule fails only above its baseline:
# .vale-baseline.json holds the count per rule on the tree it was written from, a change may hold
# or lower it, and `mise run docs:prose:baseline` rewrites the file once a count falls (a baseline
# only goes down in review). `vale <file>` by hand shows the warnings; the line above each rule
# set to warning below says why it does not fail this repository's text on its own.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = atif-sql
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
BasedOnStyles = Vale, Google, proselint

# snake_case and UPPER_SNAKE tokens are identifiers (columns, fields, functions, env vars such as
# ATIF_SQL_QUERY_THREADS) that the generated docs name in running text, not English words.
TokenIgnores = (\b[A-Za-z0-9]+(?:_[A-Za-z0-9]*)+\b)

# Off: the docs write a package name lowercase where it is the import or the CLI (`import duckdb`,
# uv) and capitalized where it is the product (DuckDB), and Vale.Terms demands one casing per
# vocabulary entry. Vale.Spelling still checks every word against the vocabulary.
Vale.Terms = NO
# Off: American technical English spells facade without the cedilla.
proselint.Diacritical = NO

# Error: the docs set no dash with a space on each side (` — `, ` – `, a line break counting as
# a space); a colon, comma, period or parentheses carries the sense instead, and one spaced dash
# fails the gate. It sits at error rather than in the warning ratchet because Vale can report two
# of its hits as one when a wrapped list item's dash meets a later one (scripts/vale_gate.py says
# when), so a count could fall on a change that adds a dash. At error a merge folds two alerts
# into one, never into none, so an added dash is red either way.
Google.EmDash = error
# Warning: a quoted literal (a status, a rule's text, a field value) keeps the punctuation that
# is not part of it outside the quotes, as the docs quote them verbatim.
Google.Quotes = warning
# Warning: it asks for the Unicode ellipsis and symbols; `...` in a synopsis is placeholder
# syntax, and the docs agents fetch stay ASCII.
proselint.Typography = warning
