# Vale prose lint for the text this repository publishes: docs/**/*.md, site/authored/**/*.md,
# README.md and AGENTS.md, which the docs site, llms.txt and the raw Markdown twins serve.
# `mise run docs:prose` (scripts/vale_gate.py) runs it, fails on any error-level alert, and fails
# when it checked zero files or fewer files than the scope holds.
#
# The two packages are pinned by release URL and `vale sync` has already written them into
# .vale/styles/, which is committed with each package's LICENSE, so the gate needs no network.
# Moving a package: change its URL, run `vale sync`, restore its LICENSE from the same tag, and
# commit the diff under .vale/styles/ with a `mise run docs:prose` over the tree.
#
# Error is the level that fails. A rule set to warning below still reports (`vale <file>` by hand
# shows it, and the gate prints the warning count as the ratchet a later change lowers); the
# line above each says why it does not fail this repository's text.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = atif-sql
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
BasedOnStyles = Vale, Google, proselint

# snake_case and UPPER_SNAKE tokens are identifiers (columns, fields, functions, env vars such as
# ATIF_SQL_QUERY_THREADS) that the generated docs name in running text, not English words.
TokenIgnores = (\b[A-Za-z0-9]+(?:_[A-Za-z0-9]*)+\b)

# Off: the docs write a package name lowercase where it is the import or the CLI (`import duckdb`,
# uv) and capitalized where it is the product (DuckDB), and Vale.Terms demands one casing per
# vocabulary entry. Vale.Spelling still checks every word against the vocabulary.
Vale.Terms = NO
# Off: American technical English spells facade without the cedilla.
proselint.Diacritical = NO

# Warning: the docs set an em dash with a space on each side throughout; the rule checks only
# that spacing, and 442 hits are one typographic choice, not 442 defects.
Google.EmDash = warning
# Warning: a quoted literal (a status, a rule's text, a field value) keeps the punctuation that
# is not part of it outside the quotes, as the docs quote them verbatim.
Google.Quotes = warning
# Warning: it asks for the Unicode ellipsis and symbols; `...` in a synopsis is placeholder
# syntax, and the docs agents fetch stay ASCII.
proselint.Typography = warning
