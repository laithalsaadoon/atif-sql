[project]
name = "atif-analytics"
version = "0.2.0"
description = "LLM analytics pipelines over the materialized ATIF corpus: session classification, stance conflicts, user friction, and perceived errors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laith Al-Saadoon" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # Pinned `==` for the same reason atif-sql pins its five: `[tool.uv.sources]` is
    # a LOCAL source an external installer never sees, so a bare name would ship as
    # `Requires-Dist: atif-models` and resolve to whatever the newest release of
    # that name is. `[tool.commitizen] version_files` rewrites this line on a bump.
    "atif-models==0.2.0",
    "loguru>=0.7.3",
    "polars>=1.40.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
    # The per-session file source reads compressed artifacts (*.zst).
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/laithalsaadoon/atif-sql"
Repository = "https://github.com/laithalsaadoon/atif-sql"
Issues = "https://github.com/laithalsaadoon/atif-sql/issues"
Changelog = "https://github.com/laithalsaadoon/atif-sql/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atif_analytics"
namespace = true

[tool.uv.sources]
atif-models = { workspace = true }
