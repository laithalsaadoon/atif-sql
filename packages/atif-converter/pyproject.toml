[project]
name = "atif-converter"
version = "0.1.0"
description = "Harbor ClaudeCode adapter wrapper + fidelity policy for Claude Code -> ATIF conversion."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laith Al-Saadoon" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # Ceiling on the minor: we depend on the PRIVATE method
    # ClaudeCode._convert_events_to_trajectory, verified against 0.22.0 only.
    # Bumping past <0.23 requires re-running the atif-converter test suite
    # (the drift alarm) and re-auditing the fidelity gaps in domain/fidelity.py.
    "harbor>=0.22.0,<0.23",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/theagenticguy/atif-sql"
Repository = "https://github.com/theagenticguy/atif-sql"
Issues = "https://github.com/theagenticguy/atif-sql/issues"
Changelog = "https://github.com/theagenticguy/atif-sql/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atif_converter"
namespace = true
