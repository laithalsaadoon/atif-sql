[project]
name = "atif-converter"
version = "0.1.0"
description = "Claude Code and Codex transcripts -> ATIF conversion, with the fidelity policy per agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laith Al-Saadoon" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # pydantic for the ATIF models vendored from harbor 0.22.0 under
    # atif_converter.domain.atif; harbor itself and litellm are dev-only (the
    # root's [dependency-groups] dev), kept for the parity oracle and the
    # pricing identity test.
    "pydantic>=2.13.2",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/laithalsaadoon/atif-sql"
Repository = "https://github.com/laithalsaadoon/atif-sql"
Issues = "https://github.com/laithalsaadoon/atif-sql/issues"
Changelog = "https://github.com/laithalsaadoon/atif-sql/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atif_converter"
namespace = true
