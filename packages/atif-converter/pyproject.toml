[project]
name = "atif-converter"
version = "0.1.0"
description = "Harbor ClaudeCode adapter wrapper + fidelity policy for Claude Code -> ATIF conversion."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laith Al-Saadoon" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # harbor is here for its PUBLIC surface only: the ATIF data classes in
    # harbor.models.trajectories (RFC 0001) and harbor.utils.trajectory_validator.
    # The conversion itself is ours (domain/claude_code_conversion.py,
    # domain/codex_conversion.py, ported from 0.22.0 under Apache-2.0), so the
    # pin no longer has to hold a private method still. The model shapes we
    # write are pinned by tests instead: a harbor release that changes them
    # fails the suite, which is the alarm a version ceiling used to stand in for.
    "harbor>=0.22.0,<1",
    # Same lazy import harbor's own converters make for per-call cost: the port
    # keeps it, so it is our dependency now rather than one we reached through
    # harbor. Floor matches harbor 0.22.0's own requirement.
    "litellm>=1.92.0",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/laithalsaadoon/atif-sql"
Repository = "https://github.com/laithalsaadoon/atif-sql"
Issues = "https://github.com/laithalsaadoon/atif-sql/issues"
Changelog = "https://github.com/laithalsaadoon/atif-sql/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atif_converter"
namespace = true
