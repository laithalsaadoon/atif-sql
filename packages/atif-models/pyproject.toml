[project]
name = "atif-models"
version = "0.1.0"
description = "Model alias registry + structured-output LLM client for atif-sql (CONTRACT-V2: no other package hardcodes a model id)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Laith Al-Saadoon" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.11.0",
    # Same floor as atif-embed, which reaches the same Bedrock runtime. Two
    # floors for one client meant the union a single distribution declares had
    # to pick one, and the looser floor would have been a resolution nothing in
    # the workspace tests.
    "boto3>=1.42.91",
    "loguru>=0.7.3",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
    "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://github.com/laithalsaadoon/atif-sql"
Repository = "https://github.com/laithalsaadoon/atif-sql"
Issues = "https://github.com/laithalsaadoon/atif-sql/issues"
Changelog = "https://github.com/laithalsaadoon/atif-sql/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atif_models"
namespace = true
